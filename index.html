<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCLL Sponsor HTML Generator & Uploader</title>
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
    <style>
        :root {
            --primary: #000099;
            --primary-hover: #000066;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #cccccc;
            --danger-color: #dc3545;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            padding: 20px;
        }

        .container { max-width: 1300px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 20px; }
        header h1 { font-size: 1.6rem; color: var(--primary); }

        .auth-bar {
            background: var(--card-bg);
            padding: 12px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .badge { padding: 5px 10px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
        .badge.disconnected { background: #ffeeba; color: #856404; }
        .badge.connected { background: #d4edda; color: #155724; }

        .workspace {
            display: grid;
            grid-template-columns: 420px 1fr;
            gap: 20px;
        }

        @media (max-width: 1024px) { .workspace { grid-template-columns: 1fr; } }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 20px;
        }

        .card h2 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
            padding-bottom: 5px;
        }

        .mode-tabs, .tabs-output { display: flex; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); }
        .mode-tab, .tab-btn {
            flex: 1; padding: 10px; text-align: center; background: #eee; cursor: pointer;
            font-weight: bold; font-size: 0.85rem; border: none; transition: background 0.2s;
        }
        .mode-tab.active, .tab-btn.active { background: var(--primary); color: white; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 4px; }
        .form-group input[type="text"], .form-group select, .form-group textarea {
            width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 0.85rem; font-family: inherit;
        }
        .form-group textarea { resize: vertical; height: 60px; }
        .form-group small { display: block; font-size: 0.75rem; color: #666; margin-top: 2px; }

        .btn {
            background: var(--primary); color: white; border: none; padding: 10px 15px;
            border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.9rem; width: 100%; transition: background 0.2s;
        }
        .btn:hover { background: var(--primary-hover); }
        .btn-danger { background: var(--danger-color); }
        .btn-danger:hover { background: #c82333; }

        .view-panel { display: none; }
        .view-panel.active { display: block; }

        textarea.code-output {
            width: 100%; height: 420px; font-family: monospace; font-size: 0.8rem;
            padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; background: #1e1e1e; color: #d4d4d4; resize: vertical;
        }

        .preview-container {
            border: 1px solid var(--border-color); border-radius: 4px; background: white; height: 420px; overflow-y: auto; padding: 10px;
        }

        #loading-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 999; justify-content: center; align-items: center; color: white; font-size: 1.2rem; font-weight: bold; flex-direction: column; gap: 10px;
        }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <div id="loading-text">Processing image and uploading to Google Drive...</div>
    </div>

    <div class="container">
        <header>
            <h1>SCLL Sponsors HTML Tool</h1>
        </header>

        <!-- Auth Connection Bar -->
        <div class="auth-bar">
            <div>
                <strong>Google Drive Connection:</strong>
                <span id="authBadge" class="badge disconnected">Disconnected</span>
            </div>
            <button id="authBtn" class="btn" style="width: auto; padding: 8px 15px; font-size: 0.85rem;" onclick="handleAuthClick()">Connect Google Drive</button>
        </div>

        <div class="workspace">
            <!-- Left Panel: Controls -->
            <div class="card">
                <div class="mode-tabs">
                    <button class="mode-tab active" onclick="switchMode('add')">Add Sponsor</button>
                    <button class="mode-tab" onclick="switchMode('remove')">Remove Sponsor</button>
                </div>

                <!-- ADD FORM -->
                <div id="addFormSection">
                    <div class="form-group">
                        <label for="addTier">Sponsor Level (Tier)</label>
                        <select id="addTier">
                            <option value="home-run">Home Run Sponsor</option>
                            <option value="triple">Triple Sponsor</option>
                            <option value="double">Double Sponsor</option>
                            <option value="single">Single Sponsor</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="sponsorName">Sponsor / Company Name (Alt text)</label>
                        <input type="text" id="sponsorName" placeholder="e.g. Acme Baseball">
                    </div>

                    <div class="form-group">
                        <label for="sponsorImage">Logo Image File</label>
                        <input type="file" id="sponsorImage" accept="image/*">
                    </div>

                    <div class="form-group">
                        <label for="sponsorLink">Website URL (Optional)</label>
                        <input type="text" id="sponsorLink" placeholder="https://www.example.com">
                    </div>

                    <div class="form-group">
                        <label for="sponsorText">Additional Text / Address (Optional)</label>
                        <textarea id="sponsorText" placeholder="123 Main Street&#10;City, State Zip"></textarea>
                    </div>

                    <button class="btn" onclick="processAddSponsor()">Upload Logo & Inject Into HTML</button>
                </div>

                <!-- REMOVE FORM -->
                <div id="removeFormSection" style="display: none;">
                    <div class="form-group">
                        <label for="removeTier">Sponsor Level (Tier)</label>
                        <select id="removeTier" onchange="populateRemoveDropdown()">
                            <option value="home-run">Home Run Sponsor</option>
                            <option value="triple">Triple Sponsor</option>
                            <option value="double">Double Sponsor</option>
                            <option value="single">Single Sponsor</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="removeIndex">Select Sponsor to Remove</label>
                        <select id="removeIndex"></select>
                    </div>

                    <button class="btn btn-danger" onclick="processRemoveSponsor()">Remove Sponsor from HTML</button>
                </div>
            </div>

            <!-- Right Panel: Editable Code & Preview -->
            <div class="card">
                <div class="tabs-output">
                    <button class="tab-btn active" onclick="switchOutputTab('code')">HTML Code (Paste/Edit Here)</button>
                    <button class="tab-btn" onclick="switchOutputTab('preview')">Live Preview</button>
                </div>

                <div id="codeView" class="view-panel active">
                    <textarea id="htmlOutputCode" class="code-output" placeholder="Paste your HTML here to start..." oninput="onCodeManualInput()"></textarea>
                    <button class="btn" style="margin-top: 10px;" onclick="copyCodeToClipboard()">Copy Updated HTML Code</button>
                </div>

                <div id="previewView" class="view-panel">
                    <div id="livePreviewContainer" class="preview-container"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // =========================================================================
        // CONFIGURATION: Paste your credentials below once so you don't have to re-enter them!
        // =========================================================================
        const GOOGLE_CLIENT_ID = "435989639083-3ilg0ot1u46ku6d24ncdf51vo7b0118h.apps.googleusercontent.com";
        const GOOGLE_DRIVE_FOLDER_ID = "1RhTi8uajr1BX05bosOCdh_ZyU_crS2Zu";
        // =========================================================================

        let currentHTML = "";
        let tokenClient = null;
        let accessToken = null;

        function onCodeManualInput() {
            currentHTML = document.getElementById('htmlOutputCode').value;
            renderPreview();
            populateRemoveDropdown();
        }

        function switchMode(mode) {
            const tabs = document.querySelectorAll('.mode-tab');
            tabs.forEach(t => t.classList.remove('active'));
            if (mode === 'add') {
                tabs[0].classList.add('active');
                document.getElementById('addFormSection').style.display = 'block';
                document.getElementById('removeFormSection').style.display = 'none';
            } else {
                tabs[1].classList.add('active');
                document.getElementById('addFormSection').style.display = 'none';
                document.getElementById('removeFormSection').style.display = 'block';
                populateRemoveDropdown();
            }
        }

        function switchOutputTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.view-panel').forEach(v => v.classList.remove('active'));
            if (tab === 'code') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('codeView').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('previewView').classList.add('active');
                renderPreview();
            }
        }

        function renderPreview() {
            document.getElementById('livePreviewContainer').innerHTML = currentHTML || "<p style='color:#888; text-align:center; padding-top:50px;'>Preview will appear here once HTML is pasted or generated.</p>";
        }

        function updateCodeOutput(newHtml) {
            currentHTML = newHtml;
            document.getElementById('htmlOutputCode').value = newHtml;
            renderPreview();
            populateRemoveDropdown();
        }

        function copyCodeToClipboard() {
            const codeArea = document.getElementById('htmlOutputCode');
            codeArea.select();
            navigator.clipboard.writeText(codeArea.value).then(() => alert("HTML code copied to clipboard!"));
        }

        // Google Authentication Logic
        function handleAuthClick() {
            if (!GOOGLE_CLIENT_ID || GOOGLE_CLIENT_ID.includes("YOUR_CLIENT_ID")) {
                alert("Please open the HTML file in a text editor and paste your Google Client ID into GOOGLE_CLIENT_ID first.");
                return;
            }

            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: GOOGLE_CLIENT_ID,
                scope: 'https://www.googleapis.com/auth/drive.file',
                callback: (resp) => {
                    if (resp.error) {
                        alert("Authentication error: " + resp.error);
                        return;
                    }
                    accessToken = resp.access_token;
                    document.getElementById('authBadge').textContent = "Connected";
                    document.getElementById('authBadge').className = "badge connected";
                    document.getElementById('authBtn').textContent = "Reconnect";
                },
            });

            tokenClient.requestAccessToken({prompt: accessToken ? '' : 'consent'});
        }

        // Image Compression helper
        function compressImage(file, maxWidth = 1000, quality = 0.85) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let width = img.width, height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => {
                            if (!blob) return reject(new Error('Canvas blob creation failed.'));
                            resolve(new File([blob], file.name.replace(/\.[^/.]+$/, "") + ".jpg", { type: 'image/jpeg', lastModified: Date.now() }));
                        }, 'image/jpeg', quality);
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // Upload file to Google Drive
        async function uploadToGoogleDrive(file) {
            if (!accessToken) throw new Error("Not connected to Google Drive. Please click 'Connect Google Drive'.");

            const metadata = { name: file.name, mimeType: file.type };
            if (GOOGLE_DRIVE_FOLDER_ID && !GOOGLE_DRIVE_FOLDER_ID.includes("YOUR_DRIVE_FOLDER_ID")) {
                metadata.parents = [GOOGLE_DRIVE_FOLDER_ID];
            }

            const form = new FormData();
            form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
            form.append('file', file);

            const response = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
                method: 'POST',
                headers: new Headers({ 'Authorization': 'Bearer ' + accessToken }),
                body: form
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error?.message || 'Google Drive upload failed.');
            }

            const fileData = await response.json();
            const fileId = fileData.id;

            // Make public
            await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}/permissions`, {
                method: 'POST',
                headers: new Headers({ 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' }),
                body: JSON.stringify({ role: 'reader', type: 'anyone' })
            });

            return `https://drive.google.com/uc?export=view&id=${fileId}`;
        }

        // Process Add Sponsor
        async function processAddSponsor() {
            if (!currentHTML.trim()) {
                alert("Please paste your existing HTML into the HTML Code box before adding a sponsor!");
                return;
            }

            const tier = document.getElementById('addTier').value;
            const name = document.getElementById('sponsorName').value.trim();
            const fileInput = document.getElementById('sponsorImage');
            const linkUrl = document.getElementById('sponsorLink').value.trim();
            const addText = document.getElementById('sponsorText').value.trim();

            if (!name) return alert("Please enter a sponsor name.");
            if (fileInput.files.length === 0) return alert("Please select a logo image file.");

            const overlay = document.getElementById('loading-overlay');
            const loadingText = document.getElementById('loading-text');
            overlay.style.display = 'flex';

            try {
                loadingText.textContent = "Compressing image...";
                const compressedFile = await compressImage(fileInput.files[0]);

                loadingText.textContent = "Uploading image to Google Drive...";
                const imageUrl = await uploadToGoogleDrive(compressedFile);

                loadingText.textContent = "Updating HTML...";
                const parser = new DOMParser();
                const doc = parser.parseFromString(currentHTML, 'text/html');

                const levelContainer = doc.querySelector(`.sponsor-level.${tier}`);
                if (!levelContainer) throw new Error(`Target sponsor tier container (class: sponsor-level ${tier}) not found in the HTML snippet.`);

                let gridContainer = levelContainer.querySelector('.sponsor-grid') || doc.createElement('div');
                gridContainer.className = 'sponsor-grid';

                const itemDiv = doc.createElement('div');
                itemDiv.className = 'sponsor-item';

                let imgHtml = `<img src="${imageUrl}" alt="${escapeHtml(name)}">`;
                itemDiv.innerHTML = linkUrl ? `<a href="${escapeHtml(linkUrl)}" target="_blank">${imgHtml}</a>` : imgHtml;

                if (addText) {
                    const pTag = doc.createElement('p');
                    pTag.innerHTML = escapeHtml(addText).replace(/\n/g, '<br>');
                    itemDiv.appendChild(pTag);
                }

                gridContainer.appendChild(itemDiv);

                const newStyle = doc.querySelector('style') ? doc.querySelector('style').outerHTML : '';
                const newBodyContent = doc.querySelector('.scll-sponsors') ? doc.querySelector('.scll-sponsors').outerHTML : doc.body.innerHTML;
                const updatedFullHTML = (newStyle ? newStyle + '\n\n' : '') + newBodyContent;

                updateCodeOutput(updatedFullHTML);
                switchOutputTab('preview');
                
                // Clear fields
                document.getElementById('sponsorName').value = '';
                fileInput.value = '';
                document.getElementById('sponsorLink').value = '';
                document.getElementById('sponsorText').value = '';

                alert("Sponsor added and HTML updated!");
            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                overlay.style.display = 'none';
            }
        }

        // Populate Remove Dropdown
        function populateRemoveDropdown() {
            const tier = document.getElementById('removeTier').value;
            const selectEl = document.getElementById('removeIndex');
            selectEl.innerHTML = '';

            if (!currentHTML.trim()) {
                selectEl.innerHTML = '<option value="">Paste HTML code first</option>';
                return;
            }

            const parser = new DOMParser();
            const doc = parser.parseFromString(currentHTML, 'text/html');
            const levelContainer = doc.querySelector(`.sponsor-level.${tier}`);
            
            if (!levelContainer) {
                selectEl.innerHTML = '<option value="">No sponsors found in tier</option>';
                return;
            }

            const items = levelContainer.querySelectorAll('.sponsor-item');
            if (items.length === 0) {
                selectEl.innerHTML = '<option value="">No sponsors in this tier</option>';
                return;
            }

            items.forEach((item, index) => {
                const img = item.querySelector('img');
                const altText = img ? (img.getAttribute('alt') || `Sponsor #${index + 1}`) : `Sponsor #${index + 1}`;
                const opt = document.createElement('option');
                opt.value = index;
                opt.textContent = `${index + 1}. ${altText}`;
                selectEl.appendChild(opt);
            });
        }

        // Process Remove Sponsor
        function processRemoveSponsor() {
            const tier = document.getElementById('removeTier').value;
            const indexToRemove = parseInt(document.getElementById('removeIndex').value);

            if (isNaN(indexToRemove)) return alert("Please select a valid sponsor to remove.");
            if (!confirm("Are you sure you want to remove this sponsor?")) return;

            const parser = new DOMParser();
            const doc = parser.parseFromString(currentHTML, 'text/html');
            const levelContainer = doc.querySelector(`.sponsor-level.${tier}`);
            
            if (levelContainer) {
                const items = levelContainer.querySelectorAll('.sponsor-item');
                if (items[indexToRemove]) items[indexToRemove].remove();
            }

            const newStyle = doc.querySelector('style') ? doc.querySelector('style').outerHTML : '';
            const newBodyContent = doc.querySelector('.scll-sponsors') ? doc.querySelector('.scll-sponsors').outerHTML : doc.body.innerHTML;
            const updatedFullHTML = (newStyle ? newStyle + '\n\n' : '') + newBodyContent;

            updateCodeOutput(updatedFullHTML);
            alert("Sponsor removed!");
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
